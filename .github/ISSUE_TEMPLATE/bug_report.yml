name: Bug report
description: A tool failed or returned wrong data
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool, e.g. br_stock
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - mofid
        - agah
        - all
        - not applicable
  - type: textarea
    id: input
    attributes:
      label: Arguments and result
      description: The arguments the agent sent and the error or wrong output. Remove anything personal.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: e.g. what the page on emofid.com or agah.com shows
  - type: input
    id: client
    attributes:
      label: MCP client and OS
      placeholder: Claude Desktop 1.x on Windows 11
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Direct connection from Iran
        - Direct connection outside Iran
        - VPN or proxy
        - IRAN_BROKERS_MCP_PROXY set
  - type: input
    id: version
    attributes:
      label: iran-brokers-mcp version
      placeholder: "0.1.0"
