[project]
name = "iran-brokers-mcp"
version = "0.1.1"
description = "Unofficial read-only MCP server for Iranian brokers Mofid (emofid.com) and Agah (agah.com): stocks, funds, options, bonds, gold, screener, announcements, education."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sepehr Radmard", email = "sepehrr80@gmail.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "mofid", "emofid", "agah", "broker", "bourse", "tehran-stock-exchange", "tse", "etf", "options", "codal", "iran", "claude", "persian", "farsi", "iran-stock-market", "mutual-funds", "sukuk", "fara-bourse", "stock-screener", "market-data", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "httpx-curl-cffi>=0.1.5",
    "curl-cffi>=0.16.3",
]

[project.urls]
Homepage = "https://github.com/sepehr071/iran-brokers-mcp"
Repository = "https://github.com/sepehr071/iran-brokers-mcp"
Issues ="https://github.com/sepehr071/iran-brokers-mcp/issues"
Website = "https://mcpfarsi.ir/"

[project.scripts]
iran-brokers-mcp = "iran_brokers_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iran_brokers_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Mofid and Agah APIs (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long Field(description=...) strings read better on one line
